services:
  - type: web
    name: pharmaprice-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaprice-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: pharmaprice-db
    plan: free
    databaseName: pharmaprice
    user: pharmaprice
